name: Update snapshots

on:
  workflow_dispatch:
    inputs:
      marker:
        description: "pytest marker to regenerate (default: snapshot)"
        required: false
        default: "snapshot"

permissions:
  contents: write
  pull-requests: write

env:
  BUVIS_SKIP_FRONTEND: "1"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-extras --group test --group dev

      - name: Regenerate snapshot baselines
        env:
          BUVIS_SNAPSHOT_CANONICAL: "1"
        run: uv run pytest -m "${{ inputs.marker }}" --snapshot-update

      - name: Verify snapshots now pass
        env:
          BUVIS_SNAPSHOT_CANONICAL: "1"
        run: uv run pytest -m "${{ inputs.marker }}"

      - name: Open pull request with updated baselines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain tests/)" ]; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="update-snapshots/${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add tests/
          git commit -m "test: regenerate snapshot baselines in canonical env"
          git push origin "$BRANCH"
          gh pr create \
            --title "test: regenerate snapshot baselines" \
            --body "Automated regeneration via update-snapshots workflow on the canonical env (Linux + Python 3.12)." \
            --base master \
            --head "$BRANCH"
