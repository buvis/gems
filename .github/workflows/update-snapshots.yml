name: Update snapshots

on:
  workflow_dispatch:
    inputs:
      marker:
        description: "pytest marker to regenerate (default: snapshot)"
        required: false
        default: "snapshot"

permissions:
  contents: write
  pull-requests: write

env:
  BUVIS_SKIP_FRONTEND: "1"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-extras --group test --group dev

      - name: Regenerate snapshot baselines
        env:
          BUVIS_SNAPSHOT_CANONICAL: "1"
        run: uv run pytest -m "${{ inputs.marker }}" --snapshot-update

      - name: Verify snapshots now pass
        env:
          BUVIS_SNAPSHOT_CANONICAL: "1"
        run: uv run pytest -m "${{ inputs.marker }}"

      - name: Open pull request with updated baselines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain tests/)" ]; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="update-snapshots/${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add tests/
          git commit -m "test: regenerate snapshot baselines in canonical env"
          git push origin "$BRANCH"
          gh pr create \
            --title "test: regenerate snapshot baselines" \
            --body "Automated regeneration via update-snapshots workflow on the canonical env (Linux + Python 3.12)." \
            --base master \
            --head "$BRANCH"
