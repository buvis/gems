name: Publish to PyPI

on:
  push:
    tags:
      - "gems-v*"
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Publish to TestPyPI"
        type: boolean
        default: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-wheels:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # hatch_build.py builds the SvelteKit frontends; kit 3 needs Node >=22.17.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.17"

      - name: Install build deps
        run: uv pip install --system maturin tomli

      - name: Pin dependencies from lockfile
        run: python tools/lib/pin_deps.py .

      - name: Build wheel
        run: uv build --wheel

      - name: Repair Linux wheel
        if: runner.os == 'Linux'
        run: |
          uv pip install --system auditwheel patchelf
          auditwheel repair dist/*.whl --wheel-dir dist-repaired
          rm -rf dist
          mv dist-repaired dist

      # One sdist for the whole release: indexes that list versions from
      # .tar.gz filenames (Artifactory, mise's pipx backend) need it.
      - name: Build sdist
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv build --sdist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*

  publish:
    needs: build-wheels
    runs-on: ubuntu-latest
    environment: ${{ (contains(github.ref_name, 'rc') || inputs.testpypi) && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist/
          pattern: wheel-*
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          repository-url: ${{ (contains(github.ref_name, 'rc') || inputs.testpypi) && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  github-release:
    needs: [build-wheels, publish]
    if: github.event_name == 'push' && !contains(github.ref_name, 'rc')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist/
          pattern: wheel-*
          merge-multiple: true

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist/
          format: cyclonedx-json
          output-file: dist/buvis-gems.cdx.json

      - name: Extract changelog
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#gems-v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          awk "/^## \[${version//./\\.}\]/{found=1; next} /^## \[/{if(found) exit} found" CHANGELOG.md > release-notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.VERSION }}
          body_path: release-notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json
