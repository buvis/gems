name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      full-suite:
        description: Run all tools when called by another workflow
        type: boolean
        default: true
  workflow_dispatch:

# Only superseded PR runs cancel each other. Pushes and releases stay independent.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUVIS_SKIP_FRONTEND: "1"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed_tools: ${{ steps.filter.outputs.changed_tools }}
      tool_groups: ${{ steps.groups.outputs.tool_groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          # Reusable workflows inherit the caller's event, not "workflow_call".
          FORCE_ALL: ${{ inputs.full-suite || github.event_name == 'workflow_dispatch' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ALL_TOOLS=$(printf '%s\n' src/tools/*/__init__.py | cut -d/ -f3 | sort | jq -R . | jq -sc .)

          if [ "$FORCE_ALL" = "true" ]; then
            echo "changed_tools=${ALL_TOOLS}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # guard null SHA on first push to a new branch
          NULL_SHA="0000000000000000000000000000000000000000"
          if [ "${BASE_SHA}" = "${NULL_SHA}" ] || [ -z "${BASE_SHA}" ]; then
            echo "changed_tools=${ALL_TOOLS}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "${BASE_SHA}..HEAD" --)

          # check if shared infrastructure changed
          RUN_ALL=false
          if echo "${CHANGED}" | grep -E '^(src/lib/|src/rust/|tests/lib/|tests/conftest\.py|pyproject\.toml|uv\.lock|hatch_build\.py|Cargo\.(toml|lock)|\.github/workflows/test\.yml)' > /dev/null; then
            RUN_ALL=true
          fi

          if [ "${RUN_ALL}" = "true" ]; then
            echo "changed_tools=${ALL_TOOLS}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # extract tool names from changed paths
          # sed succeeds with no matches (docs-only changes must not fail detection).
          TOOLS=$(echo "${CHANGED}" | sed -nE 's#^(src/tools|tests/tools)/([^/]+).*#\2#p' | sort -u)
          JSON="[]"
          if [ -n "${TOOLS}" ]; then
            JSON=$(echo "${TOOLS}" | jq -R . | jq -sc .)
          fi

          echo "changed_tools=${JSON}" >> "$GITHUB_OUTPUT"

      - name: Group selected tools
        id: groups
        env:
          CHANGED_TOOLS: ${{ steps.filter.outputs.changed_tools }}
        run: |
          GROUPS_JSON=$(jq -c '
            group_by(if . == "dot" or . == "bim" then . else "other" end)
            | map({name: (if .[0] == "dot" or .[0] == "bim" then .[0] else "other" end), tools: .})
          ' <<< "$CHANGED_TOOLS")
          echo "tool_groups=$GROUPS_JSON" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync --locked --all-extras --group test --group dev

      - name: Audit dependencies
        # Ignored CVEs (if any) come from tools/lib/audit/pip-audit-ignores.toml,
        # not anonymous inline flags. check_audit_ignores.py also fails the build if
        # an ignored CVE has since gained a fix in the resolved tree (PRD 00086).
        run: |
          IGNORE_FLAGS="$(uv run --no-sync python tools/lib/check_audit_ignores.py --print-ignore-flags)"
          uv run --no-sync pip-audit --skip-editable $IGNORE_FLAGS
          uv run --no-sync python tools/lib/check_audit_ignores.py

      - name: Lint & format check
        run: |
          uv run --no-sync ruff check src/ tests/
          uv run --no-sync ruff format --check src/ tests/

      - name: Type check
        run: uv run --no-sync mypy src/lib/ src/tools/

      - name: Run development tooling tests
        run: uv run --no-sync pytest tests/dev

  lib:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --no-default-groups --group test

      - name: Run library tests
        run: uv run --no-sync pytest tests/lib --cov=src/lib --cov-report=term-missing --cov-fail-under=80

  tools:
    needs: [detect]
    if: needs.detect.outputs.changed_tools != '[]'
    runs-on: ${{ matrix.os }}
    name: tools (${{ matrix.os }}, ${{ matrix.python-version }}, ${{ matrix.group.name }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        group: ${{ fromJson(needs.detect.outputs.tool_groups) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --no-default-groups --group test

      - name: Run selected tool tests
        id: tests
        shell: bash
        env:
          GROUP_TOOLS: ${{ toJson(matrix.group.tools) }}
        run: |
          TOOLS=$(jq -r '.[]' <<< "$GROUP_TOOLS")
          status=0
          for tool in $TOOLS; do
            echo "::group::$tool tests and coverage"
            # Separate invocations retain each tool's coverage floor. Continue
            # after failures so every tool in this group still gets checked.
            if ! uv run --no-sync pytest "tests/tools/$tool" --cov="src/tools/$tool" --cov-report=term-missing --cov-fail-under=50; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: bim
            directory: src/tools/bim/commands/serve/frontend
          - tool: postup
            directory: src/tools/postup/adapters/web/frontend
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13"
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # BIM has no frontend test suite yet; postup's component tests use jsdom.
      - name: Test frontend
        if: matrix.tool == 'postup'
        run: npm test

  # Single status check for branch protection / automerge
  test:
    if: always()
    needs: [detect, lint, lib, tools, frontend]
    runs-on: ubuntu-latest
    steps:
      - id: gate
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          LIB_RESULT: ${{ needs.lib.result }}
          TOOLS_RESULT: ${{ needs.tools.result }}
          CHANGED_TOOLS: ${{ needs.detect.outputs.changed_tools }}
        run: |
          if [ "$FRONTEND_RESULT" != "success" ]; then
            echo "Frontend checks failed"
            exit 1
          fi
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "Path detection failed"
            exit 1
          fi
          if [ "$LINT_RESULT" != "success" ]; then
            echo "Lint checks failed"
            exit 1
          fi
          if [ "$LIB_RESULT" != "success" ]; then
            echo "Lib tests failed"
            exit 1
          fi
          if [ "$TOOLS_RESULT" = "skipped" ] && [ "$CHANGED_TOOLS" = "[]" ]; then
            exit 0
          fi
          if [ "$TOOLS_RESULT" != "success" ]; then
            echo "Tool tests failed"
            exit 1
          fi
