name: problem-resolution-report
extends: note
body_section: "## Gather information"
metadata:
  type: problem-resolution-report
sections:
  # bim keeps the H1 equal to the title, so the vault's "PRR: " heading prefix is not reproduced.
  - heading: "# {title}"
  - heading: "## Define the problem"
    body: "A clear and concise description of the problem, including its scope and impact."
  - heading: "## Gather information"
    body: "This can be done through research, observation, and interviews. Gathering as much information as possible is vital to ensure that all angles of the problem are considered."
  - heading: "### What?"
    body: "This question focuses on the issue, task, or goal at hand. What problem or objective needs to be addressed?"
  - heading: "### Who?"
    body: "This question helps identify the people involved or affected by the situation. Who are the stakeholders, decision-makers, or team members?"
  - heading: "#### Reporter"
    body: "Who raised the problem: name, function, contact information."
  - heading: "#### Client employees"
    body: "Who is impacted at the client side if applicable. Otherwise, change the section title to better reflect your case."
  - heading: "### When?"
    body: "This question concerns timeframes and deadlines. Please tell me when actions should be taken or goals achieved. Are there specific milestones or deadlines to consider?"
  - heading: "### Where?"
    body: "This question pertains to the location or context in which the situation occurs. Where is the problem occurring, or where will the actions be implemented?"
  - heading: "### How?"
    body: "This question focuses on the methods, tools, or processes needed to reproduce the problem. How can the problem be reproduced?"
  - heading: "### Why?"
    body: "This question helps uncover the root cause or underlying purpose of the situation. Why is the problem happening, or why is the goal important?"
  - heading: "### Observations"
    body: "As you are collecting information to be analyzed, take note of everything you see for later reference. Don't judge, filter or anyhow asses what you observe, just log it."
  - heading: "## Analyze the information"
    body: "After the information has been gathered, the next step is to analyze it. This involves looking for patterns, identifying trends, and determining the root cause of the problem. It is crucial to approach the analysis objectively and avoid making assumptions or jumping to conclusions. Techniques like the \"5 Whys\" or Fishbone diagrams should be used."
  - heading: "### Questions"
    body: "As you are analyzing the information, record the pending questions to answer by research."
  - heading: "### Answers"
    body: "Record the facts and conclusions made."
  - heading: "## Propose solutions"
    body: "Once the information has been analyzed, the next step is to develop solutions. Brainstorm possible solutions and evaluate each based on their feasibility, effectiveness, and potential impact. Select the solution that will most likely solve the problem and have the most significant impact."
  - heading: "## Implement the solution"
    body: "After choosing the right solution, the next step is to implement it. Note the changes you had to make in methods, tools or processes to put the solution to action. Describe detailed steps for implementing the chosen solution, assigned responsibilities, and timelines."
  - heading: "## Validate the solution"
    body: "Once the solution was implemented, you need to make sure it solved the problem and didn't cause any other. Take steps that will evaluate the correctness and effectiveness of the solution."
  - heading: "## Monitor and control"
    body: "After validating the solution, you need to define and implement ongoing checks to ensure sustained success and mechanisms to address any recurrence."
  - heading: "## Document and report"
    body: "Finally, produce records of findings, actions taken, and lessons learned for future reference. Make sure to report the problem resolution to parties interested. Log the time spent working on the problem resolution."
reference:
