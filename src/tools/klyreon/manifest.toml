[tool]
name = "klyreon"
display_name = "Klyreon"
module_name = "klyreon"
description = "Autonomous Memex-Zettelkasten"
category = "knowledge-management"

[tool.interfaces]
cli = true
rest = false
tui = false
web = false

[tool.commands]
init = "Create the vault skeleton and the config that points at it"
new = "Create one spec-valid zettel with a unique ID"
validate = "Run every mechanical check over the whole vault"
ingest = "Ingest source documents into interrogated zettels"
export-claims = "Emit the claim index as JSON"
status = "Print the vault dashboard"

[tool.requirements]
python = ">=3.11"
extras = []
